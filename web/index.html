<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行业竞品调研助手</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6fa; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2d3d; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 10px; }
  header .logo { width: 26px; height: 26px; background: linear-gradient(135deg,#4f8cff,#9b6bff); border-radius: 6px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .badge { font-size: 12px; background: rgba(255,255,255,.15); padding: 3px 10px; border-radius: 12px; }
  #main { flex: 1; display: flex; overflow: hidden; }
  #chat { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #e3e8f0; }
  #events { flex: 1; overflow-y: auto; padding: 20px; }
  #inputbar { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #e3e8f0; }
  #question { flex: 1; padding: 12px 16px; border: 1px solid #cdd6e4; border-radius: 8px; font-size: 14px; outline: none; }
  #sendBtn { padding: 12px 26px; background: #4f8cff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #sendBtn:disabled { background: #a9c3f2; cursor: not-allowed; }
  .evt { background: #fff; border: 1px solid #e3e8f0; border-left: 4px solid #4f8cff; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; font-size: 13.5px; }
  .evt.assistant { border-left-color: #9b6bff; }
  .evt.tool { border-left-color: #26b5a2; }
  .evt.result { border-left-color: #f5a623; white-space: pre-wrap; }
  .evt .tag { display: inline-block; font-size: 11px; color: #fff; border-radius: 4px; padding: 2px 8px; margin-right: 8px; }
  .evt .tag.a { background: #9b6bff; } .evt .tag.t { background: #26b5a2; } .evt .tag.r { background: #f5a623; }
  .evt .time { float: right; color: #9aa7b8; font-size: 11px; }
  #files { width: 300px; padding: 20px; overflow-y: auto; background: #fff; }
  #files h3 { font-size: 14px; color: #445; margin-bottom: 12px; }
  .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid #e3e8f0; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .file-item a { color: #4f8cff; text-decoration: none; }
  .empty { color: #9aa7b8; text-align: center; margin-top: 80px; font-size: 14px; line-height: 2; }
  .loading { display: inline-block; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>行业竞品调研助手</h1>
  <span class="badge" id="modeBadge">检测运行模式…</span>
</header>
<div id="main">
  <div id="chat">
    <div id="events">
      <div class="empty" id="placeholder">输入调研问题开始<br>例如：调研智能音箱行业的竞品格局，结合我们的销售数据出一份调研报告<br><span class="loading">▋</span></div>
    </div>
    <div id="inputbar">
      <input id="question" placeholder="输入调研问题，如：对比声浪科技和我们的销售差距，并分析原因" />
      <button id="sendBtn" onclick="submitTask()">发起调研</button>
    </div>
  </div>
  <div id="files">
    <h3>生成的文件</h3>
    <div id="fileList" class="empty">暂无产物</div>
  </div>
</div>
<script>
let threadId = null;
let ws = null;
const $ = (id) => document.getElementById(id);

function addEvent(type, text) {
  const cls = { assistant_call: 'evt assistant', tool_call: 'evt tool', task_result: 'evt result', monitor_event: 'evt tool' }[type] || 'evt';
  const tagText = { assistant_call: '助手', tool_call: '工具', task_result: '结果', monitor_event: '过程' }[type] || '事件';
  const tagCls = { assistant_call: 'a', tool_call: 't', task_result: 'r', monitor_event: 't' }[type] || 't';
  const time = new Date().toTimeString().slice(0, 8);
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = `<span class="tag ${tagCls}">${tagText}</span><span class="time">${time}</span><div style="margin-top:6px">${text}</div>`;
  $('events').appendChild(div);
  $('events').scrollTop = $('events').scrollHeight;
}

function connectWS(tid) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${tid}`);
  ws.onmessage = (m) => {
    const data = JSON.parse(m.data);
    if (data.type === 'task_result') {
      addEvent('task_result', data.message || '任务完成');
      $('sendBtn').disabled = false;
      setTimeout(refreshFiles, 1000);
    } else if (data.type === 'monitor_event') {
      addEvent('monitor_event', data.message || JSON.stringify(data.data));
    }
  };
}

async function submitTask() {
  const q = $('question').value.trim();
  if (!q) return;
  $('sendBtn').disabled = true;
  $('placeholder')?.remove();
  addEvent('monitor_event', `已受理任务: ${q}`);
  const resp = await fetch('/api/task', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: q })
  });
  const data = await resp.json();
  threadId = data.thread_id;
  $('modeBadge').textContent = data.mock ? '演示模式（无 LLM Key）' : '真实模式';
  addEvent('monitor_event', `thread_id = ${threadId}`);
  connectWS(threadId);
}

async function refreshFiles() {
  if (!threadId) return;
  const resp = await fetch(`/api/files/${threadId}`);
  const data = await resp.json();
  const list = $('fileList');
  if (!data.files || !data.files.length) { list.innerHTML = '暂无产物'; return; }
  list.innerHTML = '';
  data.files.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<span>${f.name}</span><a href="/api/download/${threadId}/${encodeURIComponent(f.name)}" target="_blank">下载</a>`;
    list.appendChild(item);
  });
}

$('question').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitTask(); });
</script>
</body>
</html>
